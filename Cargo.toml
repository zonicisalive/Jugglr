[package]
name = "jugglr"
version = "0.1.0"
edition = "2021"
authors = ["Jugglr Contributors"]
description = "A low-overhead, daemonized background service for Linux that watches directories, evaluates declarative rule conditions, and executes structured actions."
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
infer = "0.19"
notify-rust = "4.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
shellexpand = "3.1"
futures-util = "0.3"
eframe = "0.30"
egui = "0.30"
egui_extras = { version = "0.30", features = ["all_loaders"] }
rfd = "0.15"
trash = "5.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
kamadak-exif = "0.6"
id3 = "1.16"
ureq = "2.12"

[dev-dependencies]
tempfile = "3.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
