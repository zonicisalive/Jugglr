<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Folder Body Gradient -->
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Folder Tab Gradient -->
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Thunder / Lightning Bolt Gradient -->
    <linearGradient id="thunderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="folderShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    
    <filter id="thunderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Folder Back Tab -->
  <path d="M 80,140 C 80,122 94,108 112,108 L 208,108 C 224,108 238,118 248,132 L 272,164 L 400,164 C 418,164 432,178 432,196 L 432,240 L 80,240 Z" 
        fill="url(#tabGrad)" />

  <!-- Main Folder Front Body -->
  <rect x="64" y="160" width="384" height="264" rx="32" 
        fill="url(#folderGrad)" 
        filter="url(#folderShadow)" />

  <!-- Folder Top Lip Highlight -->
  <path d="M 96,160 L 416,160 C 434,160 448,174 448,192 L 448,198 C 448,180 434,166 416,166 L 96,166 C 78,166 64,180 64,198 L 64,192 C 64,174 78,160 96,160 Z" 
        fill="#ffffff" 
        fill-opacity="0.25" />

  <!-- Clean Thunder / Lightning Bolt Symbol in Center -->
  <path d="M 276,196 L 204,300 L 260,300 L 236,388 L 316,280 L 260,280 Z" 
        fill="url(#thunderGrad)" 
        filter="url(#thunderGlow)" 
        stroke="#ca8a04" 
        stroke-width="3" 
        stroke-linejoin="round" />
</svg>
